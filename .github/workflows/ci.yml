name: CI

# Validation only: run the test suite and the Bandit security scan on every
# push and pull request. Does NOT build or publish the Docker image — that
# stays in `make local|dev|pubdev|prod` (scripts/build.sh).
on:
  pull_request:

jobs:
  test:
    name: Tests & security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Must satisfy pyproject requires-python (>=3.12.8); uv fetches a
          # managed build rather than relying on the runner's system Python.
          python-version: "3.12.8"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        # FWGUI_INSTANCE_ID tags any telemetry a CI run might emit. As of 3.0.0
        # the instance id lives in MongoDB, so the env var replaces the
        # data/database/instance.id file this step used to seed; it short-circuits
        # the lookup without touching a database.
        env:
          FWGUI_INSTANCE_ID: github-actions-ci
        run: uv run --extra test pytest

      - name: Run Bandit security scan
        run: uv run --extra test bandit -c pyproject.toml -r .
