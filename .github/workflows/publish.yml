name: Publish release

# On every push to master (i.e. every merged pull request): if pyproject's
# version has no GitHub release yet, run the tests and Bandit, build the
# multi-arch (ARM64/AMD64) image, push <version> and latest to the GitHub
# Container Registry and Docker Hub, then tag and create release v<version>
# with generated notes. Edit the release title/notes afterwards as needed.
#
# A push whose version already has a release (e.g. a Dependabot merge that
# did not bump the version) does nothing. The image is pushed before the
# release is created, so a release always has its image.
#
# Manual dispatch re-runs the whole thing for the current version even when
# its release exists (e.g. to re-push the image); the release step is then
# skipped.
#
# `make dev|pubdev` (scripts/build.sh) remain for internal-registry and dev
# builds; this workflow replaces `make prod` for releases.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once; queue instead of cancelling a half-done one.
concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/fw-gui
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fw-gui

jobs:
  check:
    name: Check for existing release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.release.outputs.released }}
      run: ${{ steps.release.outputs.released == 'false' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Look up release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests & security scan
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes exact versions only (no floating major tag), so pin
        # the release commit; the comment records the version it is.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        env:
          FWGUI_INSTANCE_ID: github-actions-ci
        run: uv run --extra test pytest

      - name: Run Bandit security scan
        run: uv run --extra test bandit -c pyproject.toml -r .

  publish:
    name: Build & push image
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Write .version
        run: echo "v${{ needs.check.outputs.version }}" > .version

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          # Labels include org.opencontainers.image.source, which links the
          # GHCR package to this repository.
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Local checkout context, so the .version written above is included.
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub release
    needs: [check, publish]
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          # Title the release after the merged pull request when there is one,
          # matching the "v<version> – <summary>" style of earlier releases.
          PR_TITLE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].title // empty' || true)
          TITLE="${TAG}${PR_TITLE:+ – ${PR_TITLE}}"
          gh release create "${TAG}" -R "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --generate-notes \
            --latest
