version: '3.7'
services:
  fw-gui:
    image: ibehren1/fw-gui:latest
    container_name: fw-gui
    depends_on:
      - mongodb
    environment:
      # CHANGE THIS before any non-local use — reusing the default lets anyone
      # forge session cookies. Set a unique random value, e.g.
      # `python -c "import secrets; print(secrets.token_hex(32))"`.
      - APP_SECRET_KEY='This is the secret key.'
      - DISABLE_REGISTRATION=<True|False>
      - SESSION_TIMEOUT=<number-of-minutes> # Default 120 minutes
      - MONGODB_URI=mongodb
      - BUCKET_NAME=<bucket-name>
      - AWS_ACCESS_KEY_ID=<access-key>
      - AWS_SECRET_ACCESS_KEY=<secret-access-key>
    ports:
      - 8080:8080/tcp
    restart: unless-stopped
    volumes:
      - fwgui-data:/opt/fw-gui/data
  nginx:
    restart: always
    image: 'jc21/nginx-proxy-manager:latest'
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    environment:
      DB_MYSQL_HOST: "db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "npm"
      DB_MYSQL_NAME: "npm"
    volumes:
      - nginx-data:/data
      - letsencrypt:/etc/letsencrypt
  db:
    restart: always
    image: 'jc21/mariadb-aria:latest'
    environment:
      MYSQL_ROOT_PASSWORD: 'npm'
      MYSQL_DATABASE: 'npm'
      MYSQL_USER: 'npm'
      MYSQL_PASSWORD: 'npm'
    volumes:
      - mysql-data:/var/lib/mysql
  # MongoDB runs WITHOUT authentication. This is intentional for this
  # single-stack deployment: the service publishes no `ports:`, so it is only
  # reachable by other containers on this Compose project's internal network
  # (i.e. fw-gui). It is NOT exposed to the host, LAN, or internet, and it
  # stores all firewall configs plus the session store.
  #
  # SECURITY NOTES:
  #   - Do NOT add a `ports:` mapping (e.g. 27017:27017) — that would expose an
  #     unauthenticated database to the host/network.
  #   - For any shared/multi-tenant host or external access, enable auth:
  #     set MONGO_INITDB_ROOT_USERNAME / MONGO_INITDB_ROOT_PASSWORD here and use
  #     MONGODB_URI=mongodb://user:pass@mongodb:27017/ above. (Auth only
  #     initializes on a fresh mongo-data volume; existing installs need a
  #     one-time user-creation step.)
  mongodb:
    container_name: mongodb
    image: mongo:latest
    restart: always
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
volumes:
  fwgui-data:
  nginx-data:
  mysql-data:
  letsencrypt:
  mongo-data:
  mongo-config: