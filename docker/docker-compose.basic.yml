version: '3.7'
services:
  fw-gui:
    image: ibehren1/fw-gui:latest
    container_name: fw-gui
    depends_on:
      - mongodb
    environment:
      # CHANGE THIS before any non-local use — reusing the default lets anyone
      # forge session cookies. Set a unique random value, e.g.
      # `python -c "import secrets; print(secrets.token_hex(32))"`.
      - APP_SECRET_KEY='This is the secret key.'
      - DISABLE_REGISTRATION=False
      - MONGODB_URI=mongodb
      - MONGODB_DATABASE=fwgui_database
      - BUCKET_NAME=
      - AWS_ACCESS_KEY_ID=
      - AWS_SECRET_ACCESS_KEY=
      # The automatic weekly backup has no environment variables. It is off until
      # switched on, and its day, hour and retention are set on the Admin Settings
      # page and stored in MongoDB.
    ports:
      - 8080:8080/tcp
    restart: unless-stopped
    volumes:
      - data:/opt/fw-gui/data
  # MongoDB runs WITHOUT authentication. This is intentional for this
  # single-stack deployment: the service publishes no `ports:`, so it is only
  # reachable by other containers on this Compose project's internal network
  # (i.e. fw-gui). It is NOT exposed to the host, LAN, or internet.
  #
  # As of FW-GUI 3.0.0 this database also holds the CREDENTIAL STORE (the
  # `users` collection: usernames, emails, bcrypt password hashes) and every
  # user's ENCRYPTED SSH KEY (the `keys` collection), alongside all firewall
  # configs and the session store. Anything attached to this network can read
  # both; before 3.0.0 they were files that needed filesystem access inside the
  # fw-gui container. The SSH keys are Fernet ciphertext whose key FW-GUI never
  # stores, so they are not directly usable, but the bcrypt hashes are a real
  # offline target. Enabling auth is correspondingly more worthwhile.
  #
  # SECURITY NOTES:
  #   - Do NOT add a `ports:` mapping (e.g. 27017:27017) — that would expose an
  #     unauthenticated database to the host/network.
  #   - For any shared/multi-tenant host or external access, enable auth:
  #     set MONGO_INITDB_ROOT_USERNAME / MONGO_INITDB_ROOT_PASSWORD here and use
  #     MONGODB_URI=mongodb://user:pass@mongodb:27017/ above. (Auth only
  #     initializes on a fresh mongo-data volume; existing installs need a
  #     one-time user-creation step.)
  mongodb:
    container_name: mongodb
    image: mongo:latest
    restart: always
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
volumes:
  data:
  mongo-data:
  mongo-config: